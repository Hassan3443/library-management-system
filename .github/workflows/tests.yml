name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/logic.test.cjs
      - run: for f in docs/js/*.js; do node --check "$f"; done
