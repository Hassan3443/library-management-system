<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="City Library: browse the catalog, borrow and return books, track due dates and fines.">
  <meta name="theme-color" content="#16302b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2718%27 fill=%27%2316302b%27/%3E%3Crect x=%2728%27 y=%2720%27 width=%2712%27 height=%2760%27 rx=%272%27 fill=%27%23b9882f%27/%3E%3Crect x=%2746%27 y=%2720%27 width=%2712%27 height=%2760%27 rx=%272%27 fill=%27%23f6f2ea%27/%3E%3Crect x=%2764%27 y=%2726%27 width=%2710%27 height=%2754%27 rx=%272%27 fill=%27%23b9882f%27 transform=%27rotate(8 64 26)%27/%3E%3C/svg%3E">
  <title>City Library - Login / Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=19">
  <link rel="stylesheet" href="css/glass.css?v=2">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">City<span>Library</span></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="catalog.html">Book Catalog</a>
        <a href="member.html">Member Dashboard</a>
        <a href="history.html">Borrowing History</a>
        <a href="return.html">Return Book</a>
        <a href="librarian.html">Librarian Dashboard</a>
        <a href="login.html" class="active" aria-current="page">Login</a>
      </nav>
    </div>
  </header>
  <main id="main">
    <div class="auth-wrap">
      <div class="card" id="login-card">
        <h1 style="font-size:1.6rem;margin:0 0 4px">Welcome back</h1>
        <p class="subtitle" style="margin-bottom:18px">Welcome back.</p>
        <form id="login-form">
          <label for="lemail">Email</label>
          <input type="email" id="lemail" required placeholder="you@example.com" style="margin-bottom:12px">
          <label for="lpass">Password</label>
          <input type="password" id="lpass" required placeholder="Password" style="margin-bottom:16px">
          <button class="btn" type="submit" style="width:100%">Log in</button>
        </form>
        <div id="login-msg" style="margin-top:12px"></div>
        <div class="auth-divider"><span>or</span></div>
        <button type="button" class="btn secondary google-btn" id="google-btn">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.3-4 6.8-9.9 6.8-16.9z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.5 2.2-8.8 2.2-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          Sign in with Google
        </button>
        <p class="auth-switch">Don't have an account? <a href="#register" id="show-register">Register</a></p>
      </div>
      <div class="card" id="register-card" hidden>
        <h1 style="font-size:1.6rem;margin:0 0 4px">Create your account</h1>
        <p class="subtitle" style="margin-bottom:18px">Create your account.</p>
        <form id="register-form">
          <label for="rname">Full name</label>
          <input type="text" id="rname" required placeholder="Your name" style="margin-bottom:12px">
          <label for="remail">Email</label>
          <input type="email" id="remail" required placeholder="you@example.com" style="margin-bottom:12px">
          <label for="rpass">Password</label>
          <input type="password" id="rpass" required placeholder="Choose a password" style="margin-bottom:16px">
          <button class="btn" type="submit" style="width:100%">Create account</button>
        </form>
        <div id="register-msg" style="margin-top:12px"></div>
        <div class="auth-divider"><span>or</span></div>
        <button type="button" class="btn secondary google-btn" id="google-btn-reg">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.3-4 6.8-9.9 6.8-16.9z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.5 2.2-8.8 2.2-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
          Sign up with Google
        </button>
        <p class="auth-switch">Already have an account? <a href="#login" id="show-login">Log in</a></p>
      </div>
    </div>
  </main>
  <footer class="site-footer">City Library</footer>
  <script src="js/data.js?v=20"></script>
  <script src="js/logic.js?v=21"></script>
  <script src="js/accounts.js?v=20"></script>
  <script src="js/app.js?v=22"></script>
  <script>renderLoginPage();</script>
</body>
</html>
